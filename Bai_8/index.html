<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 8: Sự kiện trong JS (Event) & classList</title>

    <style>
      .bien-mat {
        display: none;
      }

      .duong-vien {
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <h1 class="tieu-de">Sự kiện là gì?</h1>
    <!-- Thêm sự kiện ấn chuột onclick -->
    <!-- LƯU Ý: Cứ khi nào sử dụng sự kiện thì phải
     khai báo 1 HÀM 
     -->

    <h1 class="the-h1">Thẻ h1 đây</h1>

    <button onclick="doiMauChu()">Thay đổi màu chữ</button>
    <button onclick="doiCoChu()">Thay đổi cỡ chữ</button>
    <button onclick="gachChanChu()">Thêm gạch chân chữ</button>

    <button onclick="themClass()">Thêm class</button>
    <button onclick="xoaClass()">Xoá class</button>

    <!-- Sự kiện onmouseover: là khi di chuột vào 1 thẻ HTML -->
    <!-- Sự kiện onmouseout: là khi di chuột ra bên ngoài thẻ HTML -->
    <p onmouseover="inNghieng()" onmouseout="inDam()" class="the-p">
      Ví dụ sự kiện onmouseover
    </p>

    <!-- 
    1. Tạo hàm inDam() 
    2. Sử dụng JS để in đậm nội dung của thẻ p có class the-p 
    -->

    <script src="main.js"></script>
  </body>
</html>
